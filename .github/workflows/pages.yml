name: Deploy SkartCF to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "SkartCF/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SkartCF
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: SkartCF/package-lock.json

      - run: npm ci

      # The engine suite is fast and the whole point of the pure-function split,
      # so a broken engine never reaches the published site.
      - run: npm test

      # Runs tsc --noEmit first, then vite build into SkartCF/dist.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          # Paths here are workspace-relative, not affected by working-directory.
          path: SkartCF/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
