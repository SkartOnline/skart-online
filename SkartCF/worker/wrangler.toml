# The relay on Cloudflare. `main` and this file are the whole deployment.
#
#   npm run relay:deploy
#
# The address it prints is what the client needs as VITE_RELAY_URL, with the
# scheme changed to wss://. See SkartCF/README.md § Playing across a room.
name = "skart-relay"
main = "relay.ts"
compatibility_date = "2026-08-01"

# One object, holding every live room. See `ONE_RELAY` in relay.ts.
[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayRoom"

# The free plan only offers SQLite-backed Durable Objects, so the class has to
# be declared as one. This migration runs once, on the first deploy.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRoom"]
