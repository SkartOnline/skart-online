<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skart 2 - Card Editor</title>
  <style>
    :root {
      --bg: #1a1a2e; --surface: #16213e; --card-bg: #0f3460;
      --accent: #e94560; --text: #eee; --text-dim: #aaa;
      --success: #4caf50; --warn: #ff9800; --border: #333;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
    .header { background: var(--surface); padding: 12px 24px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid var(--border); }
    .header h1 { font-size: 1.2rem; flex: 1; }
    .header button { padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
    .btn-gen { background: var(--accent); color: #fff; }
    .btn-save { background: var(--success); color: #fff; }
    .btn-add { background: var(--warn); color: #000; }
    .btn-del { background: #c62828; color: #fff; font-size: 0.75rem; padding: 4px 8px; }
    .btn-small { padding: 3px 8px; font-size: 0.75rem; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 3px; cursor: pointer; }

    .layout { display: flex; height: calc(100vh - 50px); }
    .sidebar { width: 280px; background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; }
    .sidebar-filter { padding: 8px; }
    .sidebar-filter input { width: 100%; padding: 6px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 4px; }
    .card-list { list-style: none; }
    .card-list li { padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--border); font-size: 0.85rem; display: flex; justify-content: space-between; }
    .card-list li:hover { background: var(--card-bg); }
    .card-list li.active { background: var(--accent); }
    .card-list .card-id { color: var(--text-dim); font-size: 0.75rem; }
    .card-list .card-type-badge { font-size: 0.65rem; padding: 1px 5px; border-radius: 3px; }
    .type-character { background: #9c27b0; }
    .type-unit { background: #2196f3; }
    .type-spell { background: #ff9800; color: #000; }

    .editor { flex: 1; overflow-y: auto; padding: 20px; }
    .editor-empty { text-align: center; color: var(--text-dim); margin-top: 40px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 900px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group.full { grid-column: 1 / -1; }
    .form-group label { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; }
    .form-group input, .form-group select, .form-group textarea {
      padding: 6px 10px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 4px; font-size: 0.85rem;
    }
    .form-group textarea { min-height: 60px; resize: vertical; }
    .section-title { grid-column: 1 / -1; margin-top: 16px; font-size: 0.9rem; border-bottom: 1px solid var(--border); padding-bottom: 4px; color: var(--accent); }

    .ability-block { background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-top: 8px; }
    .ability-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .ability-header h4 { font-size: 0.85rem; }
    .choice-block { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 8px; margin-top: 6px; }

    .status-bar { position: fixed; bottom: 0; left: 0; right: 0; padding: 6px 16px; background: var(--surface); border-top: 1px solid var(--border); font-size: 0.8rem; color: var(--text-dim); z-index: 10; }
    .status-bar.ok { color: var(--success); }
    .status-bar.err { color: var(--accent); }

    .json-view { max-width: 900px; }
    .json-view textarea { width: 100%; min-height: 400px; font-family: 'Consolas', monospace; font-size: 0.8rem; }

    /* Step Builder */
    .step-list { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
    .step-card { background: var(--surface); border: 1px solid var(--border); border-radius: 5px; padding: 8px 10px; }
    .step-card.flow { border-left: 3px solid #ff9800; }
    .step-card.interactive { border-left: 3px solid #2196f3; }
    .step-card.meta { border-left: 3px solid #9c27b0; }
    .step-header { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .step-header select { flex: 1; padding: 4px 6px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 3px; font-size: 0.8rem; font-weight: bold; }
    .step-header .step-num { font-size: 0.7rem; color: var(--text-dim); min-width: 20px; }
    .step-props { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px 8px; }
    .step-props .sp { display: flex; flex-direction: column; gap: 2px; }
    .step-props .sp label { font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; }
    .step-props .sp input, .step-props .sp select { padding: 3px 6px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 3px; font-size: 0.78rem; }
    .step-props .sp-full { grid-column: 1 / -1; }
    .step-btn-row { display: flex; gap: 4px; }
    .step-btn-row button { padding: 2px 6px; font-size: 0.7rem; border: 1px solid var(--border); background: var(--bg); color: var(--text-dim); border-radius: 3px; cursor: pointer; }
    .step-btn-row button:hover { background: var(--card-bg); color: var(--text); }
    .step-btn-row .step-del { color: var(--accent); }
    .sub-steps-container { margin: 6px 0 0 12px; padding-left: 8px; border-left: 2px solid var(--border); }
    .sub-steps-label { font-size: 0.7rem; color: var(--warn); text-transform: uppercase; margin-top: 4px; display: flex; align-items: center; gap: 6px; }
    .choice-entry { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 6px; margin-top: 4px; }
    .choice-entry-header { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .choice-entry-header input { flex: 1; padding: 3px 6px; background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 3px; font-size: 0.78rem; }

    /* 3-Phase Section Blocks */
    .section-block { background: rgba(0,0,0,0.15); border: 1px solid var(--border); border-radius: 5px; padding: 10px; margin-top: 10px; }
    .section-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 12px; align-items: start; }
    .section-main { min-width: 0; }
    .context-help {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 8px;
      font-size: 0.74rem;
      color: var(--text-dim);
      position: sticky;
      top: 8px;
    }
    .context-help h5 { color: var(--text); font-size: 0.74rem; margin-bottom: 6px; text-transform: uppercase; }
    .context-help .help-line { margin: 3px 0; }
    .context-help .help-code {
      font-family: Consolas, monospace;
      background: rgba(0,0,0,0.25);
      color: #9be8ff;
      padding: 1px 4px;
      border-radius: 3px;
      display: inline-block;
      margin: 2px 2px 0 0;
    }
    .context-help .help-group { margin-bottom: 8px; }
    @media (max-width: 1220px) {
      .section-grid { grid-template-columns: 1fr; }
      .context-help { position: static; }
    }
    .section-block-title { font-size: 0.8rem; text-transform: uppercase; font-weight: bold; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
    .trigger-section .section-block-title { color: #ff9800; }
    .targets-section .section-block-title { color: #2196f3; }
    .effects-section .section-block-title { color: #4caf50; }
    .target-block { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 8px; margin-top: 6px; }
    .target-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 0.8rem; color: #2196f3; }
    .interactor-panel { margin-top: 6px; padding: 4px 8px; background: rgba(255,255,255,0.05); border-radius: 3px; font-size: 0.7rem; }
    .interactor-label { color: var(--text-dim); margin-right: 4px; }
    .interactor-tag { display: inline-block; padding: 1px 6px; margin: 1px; border-radius: 3px; background: rgba(233,69,96,0.2); color: #e94560; font-family: 'Consolas', monospace; font-size: 0.7rem; }
    .interactor-tag.interactor-effect { background: rgba(76,175,80,0.2); color: #4caf50; }
    .inline-target-block { background: rgba(33,150,243,0.08); border: 1px dashed #2196f3; border-radius: 4px; padding: 6px; margin-top: 6px; }
    /* Filter builder */
    .filter-builder { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 6px; margin-top: 2px; }
    .filter-pills { display: flex; flex-wrap: wrap; gap: 4px; min-height: 24px; margin-bottom: 4px; }
    .filter-pill { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; border-radius: 12px; background: rgba(33,150,243,0.15); color: #64b5f6; font-size: 0.75rem; font-family: 'Consolas', monospace; }
    .filter-pill .pill-x { cursor: pointer; color: #e94560; font-weight: bold; margin-left: 2px; }
    .filter-pill .pill-x:hover { color: #ff6b6b; }
    .filter-add-row { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
    .filter-add-row select, .filter-add-row input { font-size: 0.75rem; padding: 2px 4px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 3px; }
    .filter-add-row select { max-width: 120px; }
    .filter-add-row input { max-width: 100px; }
    .filter-add-row button { font-size: 0.7rem; padding: 2px 8px; cursor: pointer; background: var(--accent); color: #fff; border: none; border-radius: 3px; }
    .filter-special-btns { display: flex; gap: 3px; margin-top: 4px; }
    .filter-special-btns button { font-size: 0.65rem; padding: 1px 6px; cursor: pointer; background: rgba(255,193,7,0.15); color: #ffc107; border: 1px solid rgba(255,193,7,0.3); border-radius: 3px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Card Editor</h1>
    <span id="card-count"></span>
    <button class="btn-add" onclick="addCard()">+ New Card</button>
    <button class="btn-save" onclick="saveAll()">Save cards.json</button>
    <button class="btn-gen" onclick="generate()">Generate All</button>
    <label style="font-size:0.8rem;display:flex;align-items:center;gap:4px;">
      <input type="checkbox" id="json-mode"> JSON
    </label>
  </div>

  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-filter">
        <input type="text" id="filter" placeholder="Search cards..." oninput="renderList()">
      </div>
      <ul class="card-list" id="card-list"></ul>
    </div>
    <div class="editor" id="editor">
      <div class="editor-empty">Select a card from the sidebar or create a new one.</div>
    </div>
  </div>

  <div class="status-bar" id="status">Ready</div>

<script>
// ===== STATE =====
let cards = [];
let selectedIdx = -1;
let dirty = false;

// ===== CONSTANTS — aligned with trigger.gd / target.gd / effect_step.gd =====

const TRIGGER_EVENTS = [
  'ON_PLAY','CONTINUOUS','ON_TURN_START','ON_TURN_END','ON_DEATH','ON_EXILE',
  'ON_ATTACK','ON_ATTACK_KILL','ON_KILL','ON_DEFENSE','ON_TAKE_DAMAGE','ON_HEAL',
  'ON_MOVE','ON_COUNTER_CHANGE','ON_COUNTER_COUNT','ON_SPELL_ATTACHED',
  'ON_WEAPON_ATTACHED','ON_ENTERS_TILE','ACTIVATED','ON_DISCARDED','ON_DRAW',
  'ON_ADJACENCY','ON_TRANSFORM','ON_TIMER','ON_ABILITY'
];
const TRIGGER_MOD1 = ['SELF','ALLY','ENEMY','ANY'];
const TRIGGER_MOD2 = ['None','Unit','Spell','Weapon','Trap','ForceOfNature','Character'];
const TRIGGER_LIMIT_TYPES = ['NONE','PER_TURN','PER_GAME'];

const TARGET_TYPES = ['Unit','Player','Entity','Deck','Hand','Graveyard','Pile','Area','Card'];
const TARGET_OWNERS = ['Ally','Enemy','Any'];
const TARGETING_MODES = ['Automatic','PlayerChoice','OpponentChoice','Random','AllValid','Self'];

const EFFECT_STEP_GROUPS = {
  'Zone Ops':  ['Draw','Search','Reveal','Discard','MoveToZone'],
  'Damage':    ['Kill','Exile','DealDamage','Heal'],
  'Modify':    ['ModifyStat','ModifyKeyword','ModifyCounter'],
  'Board':     ['Summon','Move','Swap','MakeAttack','Attach'],
  'Meta':      ['ExecuteAbility','AutoPlay'],
};
const EFFECT_STEPS = Object.values(EFFECT_STEP_GROUPS).flat();

const FLOW_TYPES = ['none','conditional','repeat','repeat_while','for_each','choose_one'];

const CARD_CLASSES = ['Harcos','Mágus','Vaják','Zsivány','Bölcs','Garabonciás','Csodatevő','Mítikus'];
const CARD_CLASSES_OPTIONAL = [''].concat(CARD_CLASSES);

const TARGET_REFS = ['','targets[0]','targets[1]','targets[2]','SELF','SELF_OWNER','SELF_CARD','OPPONENT','CURRENT'];

const ZONES = [
  {v:'',l:'(none)'},{v:'MyHand',l:'MyHand'},{v:'EnemyHand',l:'EnemyHand'},
  {v:'MyDeck',l:'MyDeck'},{v:'EnemyDeck',l:'EnemyDeck'},
  {v:'MyDeckTop',l:'MyDeckTop'},{v:'MyDeckBottom',l:'MyDeckBottom'},
  {v:'EnemyDeckTop',l:'EnemyDeckTop'},
  {v:'MyDiscard',l:'MyDiscard'},{v:'EnemyDiscard',l:'EnemyDiscard'},
  {v:'MyPile',l:'MyPile'},{v:'EnemyPile',l:'EnemyPile'},
  {v:'MyExile',l:'MyExile'},{v:'Board',l:'Board'}
];
const ZONES_FLAT = ZONES.map(z => z.v).filter(Boolean);

const DURATIONS = [
  {v:0,l:'PERMANENT'},{v:1,l:'END_OF_TURN'},{v:2,l:'START_OF_NEXT_TURN'},
  {v:3,l:'END_OF_COMBAT'},{v:4,l:'UNTIL_USED'},{v:5,l:'WHILE_ATTACHED'}
];
const STATS = ['','ATK','HP','ATK_HP','MOVE_SPEED','ATTACK_RANGE','COST','DAMAGE_BONUS','MANA'];
// ===== ENTITY INVENTORIES — what each game object actually has =====

// Card (base) — all card types share these
const CARD_PROPS = ['card_id','card_name','card_type','card_class','card_class2','cost','rarity','tags','description','abilities','art_path','flavor_text'];

// Unit-specific card fields
const UNIT_CARD_PROPS = ['attack (atk)','hp','move_speed','attack_range'];

// Unit on board (UnitInstance) — mutable runtime state
const UNIT_BOARD_PROPS = ['current_attack','current_hp','damage_counters','rings','grid_row','grid_col','has_attacked','has_moved','moves_remaining','keywords','active_modifiers','attached_cards','owner_id'];

// Spell-specific card fields
const SPELL_CARD_PROPS = ['spell_type','spell_range','school'];

// Character-specific card fields
const CHARACTER_CARD_PROPS = ['title','signature_card_ids'];

// Player state
const PLAYER_PROPS = ['hp (20)','mana','max_mana','characters'];

// Zones — each player has these
const PLAYER_ZONES = {
  'Deck': 'draw pile — ordered, has count, top/bottom',
  'Hand': 'held cards — has count, max 10',
  'Discard (Temető)': 'dead units go here',
  'Pile (Rakás)': 'used spells, ordered',
  'Exile (Üresség)': 'removed from game permanently',
  'Board (Aréna)': '5×5 grid of tiles',
  'Bench (Pad)': 'characters, mana cards, permanents, artifacts',
};

// Tile / grid cell
const TILE_PROPS = ['row','col','occupant (UnitInstance or null)'];

// Keywords — from Rulebook
const KEYWORDS = [
  'Alkony','Álomfogó','Aura','Csatakiáltás','Halál',
  'Halálos érintés','Hajnal','Kettős csapás','Lövéstáv',
  'Megállíthatatlan','Mozgási sebesség','Páncél','Rablás',
  'Roham','Sérthetetlen','Ütéselőny','Varázsellenállás','Védelmező',
];

// Modifiable stats
const MODIFIABLE_STATS = ['ATK','HP','ATK_HP','MOVE_SPEED','ATTACK_RANGE','COST','DAMAGE_BONUS'];

// Counter types
const COUNTER_TYPES = ['rings','damage_counters'];

// Modifier types (buffs/debuffs)
const MODIFIER_TYPES = ['STAT','KEYWORD','COST','DAMAGE','MOVE_SPEED','AURA'];

// Spell types
const SPELL_TYPES = ['Azonnali','R\u00edtus','Reakci\u00f3','Permanens'];

// Target condition fields (what the parser actually supports for filtering)
const TARGET_CONDITION_FIELDS = ['cost','tag','has_ability','damaged'];

// Interactor condition fields (for trigger_interactors expressions)
const INTERACTOR_CONDITION_FIELDS = ['tag','school','type','cost','damaged','not_self'];

// Effect search/filter fields
const EFFECT_FILTER_FIELDS = ['type','cost','tag','card_id','school','has_ability','keyword','not_self','damaged','adjacent','hp','atk','move_speed','attack_range'];

// Filter builder: property → expected operator style
const FILTER_PREFIX_PROPS = ['tag','school','type','has_ability','keyword','card_id'];  // use ":"
const FILTER_BOOL_PROPS = ['not_self','damaged','adjacent'];                             // no operator
const FILTER_CMP_PROPS = ['cost','hp','atk','move_speed','attack_range'];               // use < <= > >= == !=
const FILTER_CMP_OPS = ['<','<=','>','>=','==','!='];
const FILTER_APPLY_SPECIALS = ['next_unit','next_card','all'];
const FILTER_TAG_SUGGESTIONS = ['Kalóz','Szörny','Démoni','Állat','Ember'];
const FILTER_SCHOOL_SUGGESTIONS = ['Fire','Water','Earth','Air','Shadow','Light'];
const FILTER_TYPE_OPTIONS = ['UNIT','SPELL','CHARACTER'];
const FILTER_ABILITY_OPTIONS = ['ON_PLAY','ON_DEATH','ON_KILL','ON_ATTACK','ACTIVATED','CONTINUOUS','ON_DISCARD','ON_DRAW'];

// Operators
const OPERATORS = ['==','!=','<','<=','>','>=','=',',',':'];

// Target ref tokens
const TARGET_REFS_HELP = ['targets[0]','targets[1]','targets[2]','SELF','SELF_OWNER','SELF_CARD','OPPONENT','CURRENT','PlayedCard'];

// Condition datalist entries
const GAME_STATE_CONDITIONS = ['ally_hand_count','my_hand_count','enemy_hand_count'];
const TARGET_CONDITIONS = ['cost<','cost<=','cost=','cost<SELF','tag:','has_ability:','damaged'];
const GAME_CONDITION_HINT = 'Hand-count comparisons: ally_hand_count == 0, my_hand_count > 3, etc.';
const TARGET_CONDITION_HINT = 'Filter fields: cost, tag, has_ability, damaged. Comma-separated for AND.';
const TRIGGER_INTERACTOR_HINT = 'Format: Name=cond1,cond2; Name2=cond. Fields: tag, school, type, cost, damaged, not_self.';

// ===== TRIGGER PARAMETERS — event-specific param fields =====
const TRIGGER_PARAMETERS = {
  ON_TAKE_DAMAGE:['DamageTaken'], ON_HEAL:['DamageHealed'], ON_MOVE:['TilesMoved'],
  ON_COUNTER_CHANGE:['CounterType','ChangeAmount'], ON_COUNTER_COUNT:['CounterType','CounterCount'],
  ON_ADJACENCY:['AdjacentCardCount'], ON_TIMER:['TurnTimer'],
  ACTIVATED:['Cost','CostResource'],
};

// ===== INTERACTOR LOOKUP TABLES =====
const TRIGGER_INTERACTORS = {
  ON_PLAY:['PlayedCard'], CONTINUOUS:[], ON_TURN_START:[], ON_TURN_END:[],
  ON_DEATH:['DiedUnit'], ON_EXILE:['ExiledUnit'],
  ON_ATTACK:['AttackingUnit','AttackedUnit'], ON_ATTACK_KILL:['AttackingUnit','AttackedUnit'],
  ON_KILL:['KillingUnit','KilledUnit'], ON_DEFENSE:['AttackingUnit','AttackedEntity'],
  ON_TAKE_DAMAGE:['DamageTakingEntity','SourceOfDamage'], ON_HEAL:['HealedEntity','HealingEntity'],
  ON_MOVE:['MovedEntity','MoverEntity'],
  ON_COUNTER_CHANGE:['CardWithCounters','CounterChanger'], ON_COUNTER_COUNT:['CardWithCounters'],
  ON_SPELL_ATTACHED:['HostUnit','AttachedSpell'], ON_WEAPON_ATTACHED:['HostUnit','AttachedWeapon'],
  ON_ENTERS_TILE:['EnteringUnit'], ACTIVATED:[], ON_DISCARDED:['DiscardedCard'],
  ON_DRAW:['DrawingPlayer','DrewCard'], ON_ADJACENCY:['AdjacentCard'],
  ON_TRANSFORM:['TransformingUnit','TransformedUnit'], ON_TIMER:[],
  ON_ABILITY:['AbilitySource','Ability','AbilityTarget'],
};

const EFFECT_INTERACTORS = {
  Draw:['DrawnCard'], Search:['SearchedZone','SearchResults'], Reveal:['RevealedCards'],
  Discard:['DiscardedCards'], MoveToZone:['OriginZone','GoalZone'],
  Kill:['KilledUnit'], Exile:['ExiledUnit'],
  DealDamage:['DamagedEntity'], Heal:['HealedEntity'],
  ModifyStat:['ModifiedEntity'], ModifyKeyword:['ModifiedEntity'], ModifyCounter:['ModifiedEntity'],
  Summon:['SummonedEntity'], Move:['MovedUnit'], Swap:['SwappedEntity1','SwappedEntity2'],
  MakeAttack:['AttackingUnit','AttackedEntity'], Attach:['HostUnit','AttachedCard'],
  ExecuteAbility:['AbilitySource'], AutoPlay:['AutoPlayedCard'],
};

const STEP_PARAMETERS = {
  Draw:['DrawAmount','DrawFilters'],
  Search:['ShownAmount','SelectAmount','SearchFilters','Prompt'],
  Reveal:['CardOrder','RevealAmount'],
  Discard:['DiscardAmount','DiscardFilters'],
  MoveToZone:['GoalZone','GoalZoneOrder'],
  Kill:[], Exile:[],
  DealDamage:['DamageAmount'],
  Heal:['HealAmount'],
  ModifyStat:['ModifiedStat','ModifyAmount','SetAmount','ModifyDuration','ModifyDurationTurns','ApplyFilter'],
  ModifyKeyword:['AddedKeywords','RemovedKeywords','NewKeywordDurations','NewKeywordDurationTurns'],
  ModifyCounter:['CounterType','ModifyAmount','SetAmount'],
  Summon:['SummonedEntity','SummoningTile'],
  Move:['MoveDirection','MoveAmount'],
  Swap:[],
  MakeAttack:['AttackedEntity'],
  Attach:[],
  ExecuteAbility:['AbilityType','AbilitySource','AbilityTarget'],
  AutoPlay:['Targeting'],
};

// ===== LOAD =====
async function load() {
  const r = await fetch('/api/card-editor/cards');
  const d = await r.json();
  if (d.ok) {
    cards = d.cards;
    sanitizeAllCardsInPlace();
    setStatus(`Loaded ${cards.length} cards`, 'ok');
  }
  else setStatus('Load error: ' + d.error, 'err');
  renderList();
}

function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status-bar ' + (cls || '');
}

// ===== SIDEBAR =====
function renderList() {
  const filter = document.getElementById('filter').value.toLowerCase();
  const ul = document.getElementById('card-list');
  document.getElementById('card-count').textContent = `${cards.length} cards`;
  ul.innerHTML = '';
  cards.forEach((c, i) => {
    if (filter && !c.card_name.toLowerCase().includes(filter) && !String(c.card_id).includes(filter)) return;
    const li = document.createElement('li');
    li.className = i === selectedIdx ? 'active' : '';
    li.innerHTML = `<span>${escHtml(c.card_name)} <span class="card-id">#${c.card_id}</span></span>
      <span class="card-type-badge type-${c.card_type}">${c.card_type}</span>`;
    li.onclick = () => selectCard(i);
    ul.appendChild(li);
  });
}

function selectCard(idx) {
  if (dirty && selectedIdx >= 0) readForm();
  selectedIdx = idx;
  renderList();
  renderEditor();
}

// ===== EDITOR =====
function renderEditor() {
  const ed = document.getElementById('editor');
  if (selectedIdx < 0 || selectedIdx >= cards.length) {
    ed.innerHTML = '<div class="editor-empty">Select a card.</div>';
    return;
  }
  const jsonMode = document.getElementById('json-mode').checked;
  if (jsonMode) { renderJsonEditor(); return; }

  const c = cards[selectedIdx];
  let h = '<div class="form-grid">';
  h += field('card_id', 'Card ID', c.card_id, 'number');
  h += field('card_name', 'Name', c.card_name);
  h += mkSelect('card_type', 'Type', c.card_type, ['character','unit','spell']);
  h += mkSelect('card_class', 'Class', c.card_class || CARD_CLASSES[0], CARD_CLASSES);
  h += mkSelect('card_class2', 'Class 2', c.card_class2 || '', CARD_CLASSES_OPTIONAL);
  if (c.card_type !== 'character') {
    h += field('cost', 'Cost', c.cost, 'number');
    h += field('rarity', 'Rarity (0-4)', c.rarity || 0, 'number');
  }
  h += field('file_slug', 'File Slug (optional)', c.file_slug || '');

  if (c.card_type === 'character') {
    h += '<div class="section-title">Character Fields</div>';
    h += field('title', 'Title', c.title || '');
  } else if (c.card_type === 'unit') {
    h += '<div class="section-title">Unit Fields</div>';
    h += field('attack', 'Attack', c.attack ?? 0, 'number');
    h += field('hp', 'HP', c.hp ?? 1, 'number');
    h += field('move_speed', 'Move Speed', c.move_speed ?? 1, 'number');
    h += field('attack_range', 'Range', c.attack_range ?? 1, 'number');
  } else if (c.card_type === 'spell') {
    h += '<div class="section-title">Spell Fields</div>';
    h += mkSelect('spell_type', 'Spell Type', c.spell_type || 'Azonnali', SPELL_TYPES);
    h += field('spell_range', 'Spell Range', c.spell_range ?? 0, 'number');
    h += field('school', 'School', c.school || '');
  }

  h += '<div class="section-title">Text</div>';
  h += textarea('description', 'Description', c.description);
  h += field('flavor_text', 'Flavor Text', c.flavor_text || '');
  h += field('tags', 'Tags (comma-sep)', (c.tags || []).join(', '));
  h += field('art_path', 'Art Path', c.art_path || '');
  h += '</div>';

  // Abilities
  h += '<div class="section-title" style="margin-top:20px">Abilities <button class="btn-small" onclick="addAbility()">+ Add</button></div>';
  (c.abilities || []).forEach((ab, ai) => {
    h += abilityBlock(ab, ai);
  });

  h += `<div style="margin-top:24px"><button class="btn-del" onclick="deleteCard()">Delete This Card</button></div>`;
  ed.innerHTML = h;
  dirty = true;
}

// ===== FORM HELPERS =====
function field(name, label, val, type) {
  type = type || 'text';
  const v = val != null ? val : '';
  return `<div class="form-group"><label>${label}</label><input name="${name}" type="${type}" value="${escHtml(String(v))}" onchange="markDirty()"></div>`;
}
function textarea(name, label, val) {
  return `<div class="form-group full"><label>${label}</label><textarea name="${name}" onchange="markDirty()">${escHtml(val || '')}</textarea></div>`;
}
function mkSelect(name, label, val, opts) {
  const options = opts.map(o => `<option value="${o}"${o===val?' selected':''}>${o}</option>`).join('');
  return `<div class="form-group"><label>${label}</label><select name="${name}" onchange="onTypeChange(this)">${options}</select></div>`;
}

// Step-level field helpers (use data-sp / data-param attributes)
function spSelect(attr, label, val, opts) {
  const options = opts.map(o => {
    const ov = typeof o === 'object' ? o.v : o;
    const ol = typeof o === 'object' ? o.l : o;
    return `<option value="${ov}"${String(ov)===String(val)?' selected':''}>${ol}</option>`;
  }).join('');
  return `<div class="sp"><label>${label}</label><select data-sp="${attr}" onchange="markDirty()">${options}</select></div>`;
}
function spInput(attr, label, val, type) {
  type = type || 'text';
  const v = val != null ? val : '';
  return `<div class="sp"><label>${label}</label><input data-sp="${attr}" type="${type}" value="${escHtml(String(v))}" onchange="markDirty()"></div>`;
}
let _dlId = 0;
function spCombo(attr, label, val, opts) {
  const dlName = `dl_${attr}_${_dlId++}`;
  const options = opts.map(o => `<option value="${o}">`).join('');
  return `<div class="sp"><label>${label}</label><input data-sp="${attr}" list="${dlName}" value="${escHtml(String(val || ''))}" onchange="markDirty()"><datalist id="${dlName}">${options}</datalist></div>`;
}
function paramSelect(pname, val, opts) {
  const options = opts.map(o => {
    const ov = typeof o === 'object' ? o.v : o;
    const ol = typeof o === 'object' ? o.l : o;
    return `<option value="${ov}"${String(ov)===String(val ?? '')?' selected':''}>${ol}</option>`;
  }).join('');
  return `<div class="sp"><label>${pname}</label><select data-param="${pname}" onchange="markDirty()">${options}</select></div>`;
}
function paramInput(pname, val, type) {
  type = type || 'text';
  const v = val != null ? val : '';
  return `<div class="sp"><label>${pname}</label><input data-param="${pname}" type="${type}" value="${escHtml(String(v))}" onchange="markDirty()"></div>`;
}
function paramCombo(pname, val, opts, hint) {
  const dlName = `dl_p_${pname}_${_dlId++}`;
  const options = opts.map(o => `<option value="${o}">`).join('');
  const titleAttr = hint ? ` title="${escHtml(hint)}"` : '';
  return `<div class="sp"><label>${pname}</label><input data-param="${pname}" list="${dlName}" value="${escHtml(String(val || ''))}" onchange="markDirty()"${titleAttr}><datalist id="${dlName}">${options}</datalist></div>`;
}

// ===== ABILITY BLOCK — 3-phase architecture =====
function abilityBlock(ab, ai) {
  const pf = `ab_${ai}`;
  let h = `<div class="ability-block"><div class="ability-header"><h4>Ability ${ai+1}</h4><button class="btn-del" onclick="removeAbility(${ai})">Remove</button></div>`;
  h += '<div class="form-grid">';
  h += field(`${pf}_name`, 'Name', ab.ability_name);
  h += textarea(`${pf}_desc`, 'Description', ab.description);
  h += '</div>';

  // --- TRIGGER SECTION ---
  const tr = ab.trigger || {};
  const trEvent = tr.event || 'ON_PLAY';
  h += `<div class="section-block trigger-section">`;
  h += `<div class="section-block-title">Trigger</div>`;
  h += '<div class="section-grid">';
  h += '<div class="section-main">';
  h += '<div class="form-grid">';
  h += mkSelectNamed(`${pf}_tr_event`, 'Event', trEvent, TRIGGER_EVENTS);
  h += mkSelectNamed(`${pf}_tr_mod1`, 'Modifier 1 (Who)', tr.modifier1 || 'SELF', TRIGGER_MOD1);
  h += mkSelectNamed(`${pf}_tr_mod2`, 'Modifier 2 (Type)', tr.modifier2 || 'None', TRIGGER_MOD2);
  h += mkDatalistNamed(`${pf}_tr_cond`, 'Game State Condition', tr.game_state_condition || '', GAME_STATE_CONDITIONS, GAME_CONDITION_HINT);
  h += mkDatalistNamed(`${pf}_tr_interactors`, 'Trigger Interactors (Name=cond; Name2=cond2)', formatTriggerInteractors(tr.trigger_interactors), ['PlayedCard=tag:','PlayedCard=cost<=','PlayedCard=type:','AttackedUnit=damaged','KillingUnit=tag:'], TRIGGER_INTERACTOR_HINT);
  h += mkSelectNamed(`${pf}_tr_limit`, 'Limit Type', tr.limit_type || 'NONE', TRIGGER_LIMIT_TYPES);
  h += field(`${pf}_tr_limit_count`, 'Limit Count', tr.limit_count || 0, 'number');
  // Trigger parameters (event-specific, e.g. Cost for ACTIVATED)
  const trParams = TRIGGER_PARAMETERS[trEvent] || [];
  const trParamVals = tr.parameters || {};
  trParams.forEach(pname => {
    h += field(`${pf}_tr_p_${pname}`, pname, trParamVals[pname] ?? '', pname === 'Cost' ? 'number' : 'text');
  });
  h += '</div>';
  const trigInts = TRIGGER_INTERACTORS[trEvent] || [];
  if (trigInts.length > 0) {
    h += `<div class="interactor-panel"><span class="interactor-label">Interactors:</span> ${trigInts.map(i => `<span class="interactor-tag">${escHtml(i)}</span>`).join(' ')}</div>`;
  }
  h += '</div>';
  h += renderTriggerHelp(trEvent);
  h += '</div>';
  h += `</div>`;

  // --- TARGETS SECTION ---
  h += `<div class="section-block targets-section">`;
  h += `<div class="section-block-title">Targets <button class="btn-small" onclick="addTarget(${ai})">+ Add Target</button></div>`;
  h += '<div class="section-grid">';
  h += '<div class="section-main">';
  const targets = ab.targets || [];
  if (targets.length === 0) {
    h += `<div style="font-size:0.75rem;color:var(--text-dim);padding:6px">No primary targets (auto/self targeting).</div>`;
  }
  targets.forEach((t, ti) => { h += targetBlock(t, ai, ti); });
  h += '</div>';
  h += renderTargetsHelp(targets);
  h += '</div>';
  h += `</div>`;

  // --- EFFECTS SECTION ---
  h += `<div class="section-block effects-section">`;
  h += `<div class="section-block-title">Effects <button class="btn-small" onclick="addEffect('${pf}')">+ Add Effect</button></div>`;
  h += '<div class="section-grid">';
  h += '<div class="section-main">';
  h += renderEffectList(ab.effects || [], pf);
  h += '</div>';
  h += renderEffectsHelp(ab.effects || []);
  h += '</div>';
  h += `</div>`;

  h += '</div>';
  return h;
}

function renderCodePills(values) {
  return values.map(v => `<span class="help-code">${escHtml(String(v))}</span>`).join(' ');
}

function renderTriggerHelp(eventName) {

    </div>
    <div class="help-group">
      <div class="help-line"><strong>Spell:</strong></div>
      <div>${renderCodePills(['cost','spell_type','spell_range','school','tags','card_class'])}</div>
    </div>

    </div>
    <div class="help-group">
      <div class="help-line"><strong>Deck / Hand / Discard / Pile:</strong></div>
      <div>${renderCodePills(['count','cards (array)'])}</div>
    </div>
    <div class="help-group">
      <div class="help-line"><strong>Tile:</strong></div>
      <div>${renderCodePills(TILE_PROPS)}</div>

      <div class="help-line"><strong>Filter fields (condition):</strong></div>

    <div class="help-group">
      <div class="help-line"><strong>Operators:</strong></div>

function collectEffectMetadata(effects, usedSteps, usedFlows) {
  (effects || []).forEach(e => {
    if (!e || typeof e !== 'object') return;
    if (e.step) usedSteps.add(e.step);
    const ft = e.flow && e.flow.type ? e.flow.type : null;
    if (ft && ft !== 'none') usedFlows.add(ft);
    collectEffectMetadata(e.sub_effects || [], usedSteps, usedFlows);
    collectEffectMetadata(e.else_effects || [], usedSteps, usedFlows);
    (e.choices || []).forEach(ch => collectEffectMetadata(ch.effects || [], usedSteps, usedFlows));
  });
}

function renderEffectsHelp(effects) {
  const usedSteps = new Set();
  const usedFlows = new Set();
  collectEffectMetadata(effects || [], usedSteps, usedFlows);
  const stepRows = [...usedSteps].sort().map(st => {
    const params = STEP_PARAMETERS[st] || [];
    const outputs = EFFECT_INTERACTORS[st] || [];
    return `<div class="help-group"><div class="help-line"><strong>${escHtml(st)}</strong></div><div class="help-line">Params: ${params.length ? renderCodePills(params) : '(none)'}</div><div class="help-line">Outputs: ${outputs.length ? renderCodePills(outputs) : '(none)'}</div></div>`;
  }).join('');

  return `<aside class="context-help">
    <h5>Effects — Inventory</h5>
    <div class="help-group">
      <div class="help-line"><strong>Modifiable stats:</strong></div>
      <div>${renderCodePills(MODIFIABLE_STATS)}</div>
    </div>
    <div class="help-group">
      <div class="help-line"><strong>Keywords:</strong></div>
      <div>${renderCodePills(KEYWORDS)}</div>
    </div>
    <div class="help-group">
      <div class="help-line"><strong>Counter types:</strong></div>
      <div>${renderCodePills(COUNTER_TYPES)}</div>
    </div>
    <div class="help-group">
      <div class="help-line"><strong>Modifier types:</strong></div>
      <div>${renderCodePills(MODIFIER_TYPES)}</div>
    </div>
    <div class="help-group">
      <div class="help-line"><strong>Zones:</strong></div>
      <div>${renderCodePills(ZONES_FLAT)}</div>
    </div>
    <div class="help-group">
      <div class="help-line"><strong>Durations:</strong></div>
      <div>${renderCodePills(DURATIONS.map(d=>d.l))}</div>
    </div>
    <div class="help-group">
      <div class="help-line"><strong>Search/filter fields:</strong></div>
      <div>${renderCodePills(EFFECT_FILTER_FIELDS)}</div>
    </div>
    <div class="help-group">
      <div class="help-line"><strong>Ref tokens:</strong></div>
      <div>${renderCodePills(TARGET_REFS_HELP)}</div>
    </div>
    <div class="help-group">
      <div class="help-line"><strong>Operators:</strong></div>
      <div>${renderCodePills(OPERATORS)}</div>

    ${stepRows ? '<hr style="border-color:var(--border);margin:6px 0">' + stepRows : ''}
  </aside>`;
}

/** Simple named select (not data-sp, uses name= attribute) */
function mkSelectNamed(name, label, val, opts) {
  const options = opts.map(o => `<option value="${o}"${o===val?' selected':''}>${o}</option>`).join('');
  return `<div class="form-group"><label>${label}</label><select name="${name}" onchange="markDirty()">${options}</select></div>`;
}

function mkDatalistNamed(name, label, val, opts, hint) {
  const dlName = `dl_named_${name.replace(/[^a-zA-Z0-9_]/g, '_')}`;
  const options = opts.map(o => `<option value="${escHtml(String(o))}">`).join('');
  const titleAttr = hint ? ` title="${escHtml(hint)}"` : '';
  return `<div class="form-group"><label>${label}</label><input name="${name}" list="${dlName}" value="${escHtml(String(val || ''))}" onchange="markDirty()"${titleAttr}><datalist id="${dlName}">${options}</datalist></div>`;
}

// ===== TARGET BLOCK =====
function targetBlock(t, ai, ti) {
  const pf = `ab_${ai}_t_${ti}`;
  let h = `<div class="target-block">`;
  h += `<div class="target-header"><span>Target ${ti+1}</span><button class="btn-small step-del" onclick="removeTarget(${ai},${ti})">\u2715</button></div>`;
  h += '<div class="form-grid">';
  h += mkSelectNamed(`${pf}_type`, 'Type', t.target_type || 'Unit', TARGET_TYPES);
  h += mkSelectNamed(`${pf}_owner`, 'Owner', t.owner || 'Any', TARGET_OWNERS);
  h += mkSelectNamed(`${pf}_targeting`, 'Targeting', t.targeting || 'Automatic', TARGETING_MODES);
  h += mkDatalistNamed(`${pf}_condition`, 'Condition', t.condition || '', TARGET_CONDITIONS, TARGET_CONDITION_HINT);
  h += field(`${pf}_range`, 'Range', t.range || 0, 'number');
  h += field(`${pf}_count`, 'Count', t.count ?? 1, 'number');
  h += field(`${pf}_prompt`, 'Prompt', t.prompt || '');
  h += '</div></div>';
  return h;
}

// ===== INLINE TARGET (on effect steps) =====
function inlineTargetBlock(t, prefix, si) {
  const pf = `${prefix}_s${si}_it`;
  let h = `<div data-inline-target="${prefix}_s${si}">`;
  h += '<div class="form-grid">';
  h += mkSelectNamed(`${pf}_type`, 'Type', t.target_type || 'Unit', TARGET_TYPES);
  h += mkSelectNamed(`${pf}_owner`, 'Owner', t.owner || 'Any', TARGET_OWNERS);
  h += mkSelectNamed(`${pf}_targeting`, 'Targeting', t.targeting || 'Automatic', TARGETING_MODES);
  h += mkDatalistNamed(`${pf}_condition`, 'Condition', t.condition || '', TARGET_CONDITIONS, TARGET_CONDITION_HINT);
  h += field(`${pf}_range`, 'Range', t.range || 0, 'number');
  h += field(`${pf}_count`, 'Count', t.count ?? 1, 'number');
  h += field(`${pf}_prompt`, 'Prompt', t.prompt || '');
  h += '</div></div>';
  return h;
}

// ===== EFFECTS BUILDER =====

function effectStepOptgroups(selected) {
  let h = `<option value=""${selected===''?' selected':''}>(flow-only)</option>`;
  for (const [group, types] of Object.entries(EFFECT_STEP_GROUPS)) {
    h += `<optgroup label="${group}">`;
    for (const t of types) {
      h += `<option value="${t}"${t===selected?' selected':''}>${t}</option>`;
    }
    h += '</optgroup>';
  }
  return h;
}

function getEffectCategory(st) {
  if (!st) return 'flow';
  if (['ExecuteAbility','AutoPlay'].includes(st)) return 'meta';
  return '';
}

function renderEffectList(effects, prefix) {
  if (!effects || effects.length === 0) {
    return `<div class="step-list" data-step-list="${prefix}"><div style="font-size:0.75rem;color:var(--text-dim);padding:6px">No effects yet.</div></div>`;
  }
  let h = `<div class="step-list" data-step-list="${prefix}">`;
  effects.forEach((ef, si) => { h += renderEffectCard(ef, prefix, si, effects.length); });
  h += '</div>';
  return h;
}

function renderEffectCard(effect, prefix, si, total) {
  const st = effect.step || '';
  const ft = (effect.flow && effect.flow.type) ? effect.flow.type : 'none';
  const isFlowOnly = !st && ft !== 'none';
  const cat = isFlowOnly || ft !== 'none' ? 'flow' : getEffectCategory(st);

  let h = `<div class="step-card ${cat}" data-step-idx="${si}" data-prefix="${prefix}">`;

  // Header
  h += `<div class="step-header">`;
  h += `<span class="step-num">#${si+1}</span>`;
  h += `<select data-sp="step" onchange="onEffectStepChange('${prefix}',${si},this.value)">${effectStepOptgroups(st)}</select>`;
  h += `<div class="step-btn-row">`;
  if (si > 0) h += `<button onclick="moveEffect('${prefix}',${si},-1)" title="Up">\u25B2</button>`;
  if (si < total-1) h += `<button onclick="moveEffect('${prefix}',${si},1)" title="Down">\u25BC</button>`;
  h += `<button onclick="dupeEffect('${prefix}',${si})" title="Duplicate">\u2398</button>`;
  h += `<button class="step-del" onclick="removeEffect('${prefix}',${si})" title="Delete">\u2715</button>`;
  h += `</div></div>`;

  // Parameters — dynamic based on step type
  const paramDefs = STEP_PARAMETERS[st] || [];
  const params = effect.parameters || {};
  if (st && paramDefs.length > 0) {
    h += `<div class="step-props">`;
    for (const pname of paramDefs) {
      h += renderParamField(pname, params[pname]);
    }
    h += `</div>`;
  }

  // Common fields: target_ref, tag
  h += `<div class="step-props" style="margin-top:4px">`;
  if (st) {
    h += spCombo('target_ref', 'Target Ref', effect.target_ref || '', TARGET_REFS);
  }
  h += spInput('tag', 'Tag', effect.tag || '');
  h += `</div>`;

  // Inline target
  if (effect.inline_target) {
    h += `<div class="inline-target-block">`;
    h += `<div class="sub-steps-label">INLINE TARGET <button class="btn-small step-del" onclick="removeInlineTarget('${prefix}',${si})">\u2715</button></div>`;
    h += inlineTargetBlock(effect.inline_target, prefix, si);
    h += `</div>`;
  } else if (st) {
    h += `<button class="btn-small" onclick="addInlineTarget('${prefix}',${si})" style="margin-top:4px">+ Inline Target</button>`;
  }

  // Flow section
  h += `<div class="step-props" style="margin-top:4px">`;
  h += spSelect('flow_type', 'Flow', ft, FLOW_TYPES);
  if (ft === 'conditional' || ft === 'repeat_while') {
    h += spInput('flow_condition', ft === 'conditional' ? 'Condition' : 'While', (effect.flow && effect.flow.condition) || '');
  }
  if (ft === 'repeat') {
    h += spInput('flow_count', 'Count', (effect.flow && effect.flow.count) || 0, 'number');
  }
  if (ft === 'for_each') {
    h += spInput('flow_source', 'Source', (effect.flow && effect.flow.source) || '');
  }
  h += `</div>`;

  // Sub-effects
  if (['conditional','repeat','repeat_while','for_each'].includes(ft)) {
    const subPrefix = `${prefix}_s${si}_sub`;
    h += `<div class="sub-steps-container">`;
    h += `<div class="sub-steps-label">THEN / Sub-Effects <button class="btn-small" onclick="addEffect('${subPrefix}')">+ Add</button></div>`;
    h += renderEffectList(effect.sub_effects || [], subPrefix);
    h += `</div>`;
  }

  // Else-effects (conditional only)
  if (ft === 'conditional') {
    const elsePrefix = `${prefix}_s${si}_else`;
    h += `<div class="sub-steps-container">`;
    h += `<div class="sub-steps-label">ELSE <button class="btn-small" onclick="addEffect('${elsePrefix}')">+ Add</button></div>`;
    h += renderEffectList(effect.else_effects || [], elsePrefix);
    h += `</div>`;
  }

  // Choices (choose_one only)
  if (ft === 'choose_one') {
    h += `<div class="sub-steps-container">`;
    h += `<div class="sub-steps-label">CHOICES <button class="btn-small" onclick="addChoice('${prefix}',${si})">+ Add Choice</button></div>`;
    const choices = effect.choices || [];
    choices.forEach((ch, ci) => {
      const choicePrefix = `${prefix}_s${si}_ch${ci}`;
      h += `<div class="choice-entry">`;
      h += `<div class="choice-entry-header">`;
      h += `<span style="font-size:0.7rem;color:var(--text-dim)">#${ci+1}</span>`;
      h += `<input data-choice-label="${prefix}_s${si}_ch${ci}" value="${escHtml(ch.label || '')}" placeholder="Choice label" onchange="markDirty()">`;
      h += `<button class="btn-small step-del" onclick="removeChoice('${prefix}',${si},${ci})">\u2715</button>`;
      h += `</div>`;
      h += renderEffectList(ch.effects || [], choicePrefix);
      h += `<button class="btn-small" onclick="addEffect('${choicePrefix}')" style="margin-top:4px">+ Effect</button>`;
      h += `</div>`;
    });
    h += `</div>`;
  }

  // Also render sub_effects for Attach type (host-death behavior)
  if (st === 'Attach' && ft === 'none') {
    const subPrefix = `${prefix}_s${si}_sub`;
    h += `<div class="sub-steps-container">`;
    h += `<div class="sub-steps-label">ON HOST DEATH <button class="btn-small" onclick="addEffect('${subPrefix}')">+ Add</button></div>`;
    h += renderEffectList(effect.sub_effects || [], subPrefix);
    h += `</div>`;
  }

  // Interactor display
  if (st) {
    const inters = EFFECT_INTERACTORS[st] || [];
    if (inters.length > 0) {
      const tagPrefix = effect.tag ? effect.tag + '.' : '';
      h += `<div class="interactor-panel"><span class="interactor-label">Outputs:</span> ${inters.map(i => `<span class="interactor-tag interactor-effect">${escHtml(tagPrefix + i)}</span>`).join(' ')}</div>`;
    }
  }

  h += '</div>';
  return h;
}

// ===== PARAMETER FIELD RENDERER =====
function renderParamField(pname, val) {
  // Zone fields
  if (pname.endsWith('Zone')) {
    return paramSelect(pname, val, ZONES);
  }
  // Stat fields
  if (pname === 'ModifiedStat') {
    return paramCombo(pname, val, STATS, 'Allowed stats: ATK, HP, ATK_HP, MOVE_SPEED, ATTACK_RANGE, COST, DAMAGE_BONUS, MANA');
  }
  // Duration fields
  if (pname === 'ModifyDuration' || pname === 'NewKeywordDurations') {
    return paramSelect(pname, val ?? 0, DURATIONS);
  }
  // Keyword fields
  if (pname === 'AddedKeywords' || pname === 'RemovedKeywords') {
    return paramCombo(pname, val, KEYWORDS);
  }
  // Zone order
  if (pname === 'GoalZoneOrder' || pname === 'CardOrder') {
    return paramCombo(pname, val, ['','Top','Bottom','Random','Shuffle']);
  }
  // Targeting for AutoPlay
  if (pname === 'Targeting') {
    return paramCombo(pname, val, TARGETING_MODES);
  }
  // Filter fields → filter builder
  if (pname === 'DrawFilters' || pname === 'SearchFilters' || pname === 'DiscardFilters' || pname === 'ApplyFilter') {
    return filterBuilder(pname, val);
  }
  // Default: text input (supports expressions and numbers)
  return paramInput(pname, val);
}

// ===== FILTER BUILDER =====
var _fbId = 0;
function filterBuilder(pname, val) {
  const id = `fb_${_fbId++}`;
  const clauses = (val || '').split(',').map(s => s.trim()).filter(Boolean);
  const isApply = (pname === 'ApplyFilter');

  let h = `<div class="sp" style="grid-column: span 2;"><label>${pname}</label>`;
  h += `<div class="filter-builder" id="${id}">`;
  h += `<input type="hidden" class="fb-value" data-param="${pname}" value="${escHtml(val || '')}">`;

  // Pills
  h += `<div class="filter-pills">`;
  clauses.forEach((c, i) => {
    h += `<span class="filter-pill">${escHtml(c)}<span class="pill-x" onclick="fbRemove('${id}',${i})">×</span></span>`;
  });
  h += `</div>`;

  // Add row
  h += `<div class="filter-add-row">`;
  h += `<select class="fb-prop" onchange="fbPropChanged('${id}')">`;
  h += `<option value="">+ clause…</option>`;
  FILTER_PREFIX_PROPS.forEach(p => { h += `<option value="pfx:${p}">${p}:</option>`; });
  FILTER_BOOL_PROPS.forEach(p => { h += `<option value="bool:${p}">${p}</option>`; });
  FILTER_CMP_PROPS.forEach(p => { h += `<option value="cmp:${p}">${p} ◆</option>`; });
  h += `</select>`;
  h += `<select class="fb-op" style="display:none">`;
  FILTER_CMP_OPS.forEach(o => { h += `<option value="${o}">${o}</option>`; });
  h += `</select>`;
  h += `<input class="fb-val" style="display:none" placeholder="value">`;
  h += `<button onclick="fbAdd('${id}')">Add</button>`;
  h += `</div>`;

  // Special tokens for ApplyFilter
  if (isApply) {
    h += `<div class="filter-special-btns">`;
    FILTER_APPLY_SPECIALS.forEach(s => {
      h += `<button onclick="fbAddSpecial('${id}','${s}')">${s}</button>`;
    });
    h += `</div>`;
  }

  h += `</div></div>`;
  return h;
}

function _fbGetClauses(id) {
  const el = document.getElementById(id);
  const v = el.querySelector('.fb-value').value;
  return v ? v.split(',').map(s => s.trim()).filter(Boolean) : [];
}
function _fbSetClauses(id, clauses) {
  const el = document.getElementById(id);
  el.querySelector('.fb-value').value = clauses.join(',');
  // Re-render pills
  const pills = el.querySelector('.filter-pills');
  pills.innerHTML = clauses.map((c, i) =>
    `<span class="filter-pill">${escHtml(c)}<span class="pill-x" onclick="fbRemove('${id}',${i})">×</span></span>`
  ).join('');
  markDirty();
}
function fbRemove(id, idx) {
  const clauses = _fbGetClauses(id);
  clauses.splice(idx, 1);
  _fbSetClauses(id, clauses);
}
function fbPropChanged(id) {
  const el = document.getElementById(id);
  const sel = el.querySelector('.fb-prop').value;
  const opEl = el.querySelector('.fb-op');
  const valEl = el.querySelector('.fb-val');
  if (sel.startsWith('cmp:')) {
    opEl.style.display = '';
    valEl.style.display = '';
    valEl.placeholder = 'number or ref';
    valEl.setAttribute('list', '');
  } else if (sel.startsWith('pfx:')) {
    opEl.style.display = 'none';
    valEl.style.display = '';
    const prop = sel.substring(4);
    // Set suggestions
    let dlId = '';
    if (prop === 'tag') { dlId = _ensureDatalist('fb_dl_tags', FILTER_TAG_SUGGESTIONS); }
    else if (prop === 'school') { dlId = _ensureDatalist('fb_dl_schools', FILTER_SCHOOL_SUGGESTIONS); }
    else if (prop === 'type') { dlId = _ensureDatalist('fb_dl_types', FILTER_TYPE_OPTIONS); }
    else if (prop === 'has_ability') { dlId = _ensureDatalist('fb_dl_abilities', FILTER_ABILITY_OPTIONS); }
    else if (prop === 'keyword') { dlId = _ensureDatalist('fb_dl_keywords', KEYWORDS); }
    valEl.setAttribute('list', dlId);
    valEl.placeholder = prop;
  } else {
    opEl.style.display = 'none';
    valEl.style.display = 'none';
  }
}
function _ensureDatalist(dlId, opts) {
  if (!document.getElementById(dlId)) {
    const dl = document.createElement('datalist');
    dl.id = dlId;
    dl.innerHTML = opts.map(o => `<option value="${o}">`).join('');
    document.body.appendChild(dl);
  }
  return dlId;
}
function fbAdd(id) {
  const el = document.getElementById(id);
  const sel = el.querySelector('.fb-prop').value;
  if (!sel) return;
  let clause = '';
  if (sel.startsWith('bool:')) {
    clause = sel.substring(5);
  } else if (sel.startsWith('pfx:')) {
    const prop = sel.substring(4);
    const v = el.querySelector('.fb-val').value.trim();
    if (!v) return;
    clause = `${prop}:${v}`;
  } else if (sel.startsWith('cmp:')) {
    const prop = sel.substring(4);
    const op = el.querySelector('.fb-op').value;
    const v = el.querySelector('.fb-val').value.trim();
    if (!v) return;
    clause = `${prop}${op}${v}`;
  }
  if (!clause) return;
  const clauses = _fbGetClauses(id);
  clauses.push(clause);
  _fbSetClauses(id, clauses);
  el.querySelector('.fb-prop').value = '';
  el.querySelector('.fb-val').value = '';
  el.querySelector('.fb-op').style.display = 'none';
  el.querySelector('.fb-val').style.display = 'none';
}
function fbAddSpecial(id, token) {
  const clauses = _fbGetClauses(id);
  if (!clauses.includes(token)) {
    clauses.push(token);
    _fbSetClauses(id, clauses);
  }
}

// ===== EFFECT MUTATIONS =====

/** Resolve a prefix like "ab_0_s2_sub_s0_else" into the effects array ref */
function resolveEffectArray(prefix) {
  const parts = prefix.split('_');
  const ai = parseInt(parts[1]);
  const c = cards[selectedIdx];
  const ab = c.abilities[ai];
  let arr = ab.effects;
  if (!arr) { ab.effects = []; arr = ab.effects; }

  let i = 2;
  while (i < parts.length) {
    if (parts[i].startsWith('s') && !isNaN(parts[i].substring(1))) {
      const si = parseInt(parts[i].substring(1));
      const step = arr[si];
      i++;
      if (i < parts.length) {
        if (parts[i] === 'sub') {
          if (!step.sub_effects) step.sub_effects = [];
          arr = step.sub_effects;
        } else if (parts[i] === 'else') {
          if (!step.else_effects) step.else_effects = [];
          arr = step.else_effects;
        } else if (parts[i].startsWith('ch')) {
          const ci = parseInt(parts[i].substring(2));
          if (!step.choices) step.choices = [];
          if (!step.choices[ci]) step.choices[ci] = { label: '', effects: [] };
          arr = step.choices[ci].effects;
        }
      }
      i++;
    } else {
      i++;
    }
  }
  return arr;
}

function addEffect(prefix) {
  readForm();
  const arr = resolveEffectArray(prefix);
  arr.push({ step: 'Draw', parameters: { DrawAmount: 1 } });
  renderEditor();
}

function removeEffect(prefix, si) {
  readForm();
  const arr = resolveEffectArray(prefix);
  arr.splice(si, 1);
  renderEditor();
}

function moveEffect(prefix, si, dir) {
  readForm();
  const arr = resolveEffectArray(prefix);
  const ni = si + dir;
  if (ni < 0 || ni >= arr.length) return;
  [arr[si], arr[ni]] = [arr[ni], arr[si]];
  renderEditor();
}

function dupeEffect(prefix, si) {
  readForm();
  const arr = resolveEffectArray(prefix);
  arr.splice(si + 1, 0, JSON.parse(JSON.stringify(arr[si])));
  renderEditor();
}

function addChoice(prefix, si) {
  readForm();
  const arr = resolveEffectArray(prefix);
  const step = arr[si];
  if (!step.choices) step.choices = [];
  step.choices.push({ label: 'Choice ' + (step.choices.length + 1), effects: [] });
  renderEditor();
}

function removeChoice(prefix, si, ci) {
  readForm();
  const arr = resolveEffectArray(prefix);
  arr[si].choices.splice(ci, 1);
  renderEditor();
}

function onEffectStepChange(prefix, si, newStep) {
  readForm();
  const arr = resolveEffectArray(prefix);
  arr[si].step = newStep;
  renderEditor();
}

function addTarget(ai) {
  readForm();
  const c = cards[selectedIdx];
  if (!c.abilities[ai].targets) c.abilities[ai].targets = [];
  c.abilities[ai].targets.push({ target_type: 'Unit', owner: 'Any', targeting: 'PlayerChoice', count: 1 });
  renderEditor();
}

function removeTarget(ai, ti) {
  readForm();
  cards[selectedIdx].abilities[ai].targets.splice(ti, 1);
  renderEditor();
}

function addInlineTarget(prefix, si) {
  readForm();
  const arr = resolveEffectArray(prefix);
  arr[si].inline_target = { target_type: 'Unit', owner: 'Any', targeting: 'PlayerChoice', count: 1 };
  renderEditor();
}

function removeInlineTarget(prefix, si) {
  readForm();
  const arr = resolveEffectArray(prefix);
  delete arr[si].inline_target;
  renderEditor();
}

function renderJsonEditor() {
  const c = cards[selectedIdx];
  const ed = document.getElementById('editor');
  ed.innerHTML = `<div class="json-view"><textarea id="json-raw" onchange="markDirty()">${escHtml(JSON.stringify(c, null, 2))}</textarea>
    <button class="btn-save" style="margin-top:8px" onclick="applyJson()">Apply JSON</button></div>`;
}

function formatTriggerInteractors(obj) {
  if (!obj || typeof obj !== 'object') return '';
  return Object.entries(obj)
    .filter(([k, v]) => k && typeof v === 'string' && v.trim() !== '')
    .map(([k, v]) => `${k}=${v}`)
    .join('; ');
}

function parseTriggerInteractors(raw) {
  const txt = (raw || '').trim();
  if (!txt) return undefined;
  const out = {};
  txt.split(';').forEach(part => {
    const entry = part.trim();
    if (!entry) return;
    const eq = entry.indexOf('=');
    if (eq <= 0) return;
    const key = entry.slice(0, eq).trim();
    const value = entry.slice(eq + 1).trim();
    if (key && value) out[key] = value;
  });
  return Object.keys(out).length > 0 ? out : undefined;
}

// ===== FORM I/O =====
function readForm() {
  if (selectedIdx < 0) return;
  const jsonMode = document.getElementById('json-mode').checked;
  if (jsonMode) return;

  const c = cards[selectedIdx];
  c.card_id = num('card_id');
  c.card_name = val('card_name');
  c.card_type = val('card_type');
  c.card_class = val('card_class') || CARD_CLASSES[0];
  c.card_class2 = val('card_class2') || undefined;
  const fs = val('file_slug');
  c.file_slug = fs || undefined;
  c.description = val('description');
  c.flavor_text = val('flavor_text') || undefined;
  c.art_path = val('art_path') || undefined;
  const tags = val('tags');
  c.tags = tags ? tags.split(',').map(t => t.trim()).filter(Boolean) : undefined;

  if (c.card_type === 'character') {
    c.title = val('title') || undefined;
    delete c.cost;
    delete c.rarity;
    delete c.health;
    delete c.attack; delete c.hp; delete c.move_speed; delete c.attack_range;
    delete c.spell_type; delete c.spell_range; delete c.school;
  } else if (c.card_type === 'unit') {
    c.cost = num('cost');
    c.rarity = num('rarity') || undefined;
    c.attack = num('attack');
    c.hp = num('hp');
    c.move_speed = num('move_speed');
    c.attack_range = num('attack_range');
    delete c.title; delete c.health;
    delete c.spell_type; delete c.spell_range; delete c.school;
  } else {
    c.cost = num('cost');
    c.rarity = num('rarity') || undefined;
    c.spell_type = val('spell_type') || undefined;
    c.spell_range = num('spell_range');
    c.school = val('school') || undefined;
    delete c.title; delete c.health;
    delete c.attack; delete c.hp; delete c.move_speed; delete c.attack_range;
  }

  // Read abilities
  c.abilities = [];
  let ai = 0;
  while (document.querySelector(`[name="ab_${ai}_name"]`)) {
    const ab = {
      ability_name: val(`ab_${ai}_name`),
      description: val(`ab_${ai}_desc`),
    };

    // --- Read trigger ---
    ab.trigger = {};
    const ev = val(`ab_${ai}_tr_event`);
    if (ev) ab.trigger.event = ev;
    const m1 = val(`ab_${ai}_tr_mod1`);
    if (m1 && m1 !== 'SELF') ab.trigger.modifier1 = m1;
    const m2 = val(`ab_${ai}_tr_mod2`);
    if (m2 && m2 !== 'None') ab.trigger.modifier2 = m2;
    const gc = val(`ab_${ai}_tr_cond`);
    if (gc) ab.trigger.game_state_condition = gc;
    const interactorRaw = val(`ab_${ai}_tr_interactors`);
    const interactorMap = parseTriggerInteractors(interactorRaw);
    if (interactorMap) ab.trigger.trigger_interactors = interactorMap;
    const lt = val(`ab_${ai}_tr_limit`);
    if (lt && lt !== 'NONE') {
      ab.trigger.limit_type = lt;
      ab.trigger.limit_count = num(`ab_${ai}_tr_limit_count`);
    }
    // Read trigger parameters
    const trPNames = TRIGGER_PARAMETERS[ev] || [];
    if (trPNames.length > 0) {
      const trP = {};
      trPNames.forEach(pname => {
        const pv = val(`ab_${ai}_tr_p_${pname}`);
        if (pv !== '' && pv != null) {
          trP[pname] = isNaN(Number(pv)) ? pv : Number(pv);
        }
      });
      if (Object.keys(trP).length > 0) ab.trigger.parameters = trP;
    }

    // --- Read targets ---
    ab.targets = [];
    let ti = 0;
    while (document.querySelector(`[name="ab_${ai}_t_${ti}_type"]`)) {
      const t = {
        target_type: val(`ab_${ai}_t_${ti}_type`),
        owner: val(`ab_${ai}_t_${ti}_owner`),
        targeting: val(`ab_${ai}_t_${ti}_targeting`),
      };
      const tc = val(`ab_${ai}_t_${ti}_condition`);
      if (tc) t.condition = tc;
      const tr = num(`ab_${ai}_t_${ti}_range`);
      if (tr) t.range = tr;
      const tcnt = num(`ab_${ai}_t_${ti}_count`);
      if (tcnt && tcnt !== 1) t.count = tcnt;
      const tp = val(`ab_${ai}_t_${ti}_prompt`);
      if (tp) t.prompt = tp;
      ab.targets.push(t);
      ti++;
    }

    // --- Read effects ---
    ab.effects = readEffectsFromDOM(`ab_${ai}`);

    c.abilities.push(ab);
    ai++;
  }
  dirty = false;
}

/** Recursively read effect cards from the DOM */
function readEffectsFromDOM(prefix) {
  const listEl = document.querySelector(`[data-step-list="${prefix}"]`);
  if (!listEl) return [];
  const effects = [];
  const stepCards = Array.from(listEl.children).filter(el => el.classList.contains('step-card'));
  stepCards.forEach((card, si) => {
    const effect = {};

    // Read step type
    const stepEl = card.querySelector(':scope > .step-header [data-sp="step"]');
    if (stepEl) effect.step = stepEl.value;

    // Read parameters from data-param fields (only direct, not nested)
    const params = {};
    card.querySelectorAll('[data-param]').forEach(el => {
      if (el.closest('.step-card') !== card) return;
      const key = el.getAttribute('data-param');
      const v = el.value;
      if (v === '' || v == null) return;
      // Try to parse as number
      if (!isNaN(v) && v.trim() !== '') {
        params[key] = Number(v);
      } else {
        params[key] = v;
      }
    });
    if (Object.keys(params).length > 0) {
      const allowed = new Set(STEP_PARAMETERS[effect.step || ''] || []);
      const filtered = {};
      Object.keys(params).forEach(k => {
        if (allowed.has(k)) filtered[k] = params[k];
      });
      if (Object.keys(filtered).length > 0) effect.parameters = filtered;
    }

    // Read common sp fields (only direct, not nested)
    card.querySelectorAll('[data-sp]').forEach(el => {
      if (el.closest('.step-card') !== card) return;
      const key = el.getAttribute('data-sp');
      if (key === 'step') return;
      if (key === 'tag' && el.value) effect.tag = el.value;
      if (key === 'target_ref' && el.value) effect.target_ref = el.value;
      if (key === 'flow_type') {
        const fv = el.value;
        if (fv && fv !== 'none') {
          if (!effect.flow) effect.flow = { type: fv };
          else effect.flow.type = fv;
        }
      }
      if (key === 'flow_condition' && el.value) {
        if (!effect.flow) effect.flow = {};
        effect.flow.condition = el.value;
      }
      if (key === 'flow_count') {
        const n = parseInt(el.value) || 0;
        if (n) { if (!effect.flow) effect.flow = {}; effect.flow.count = n; }
      }
      if (key === 'flow_source' && el.value) {
        if (!effect.flow) effect.flow = {};
        effect.flow.source = el.value;
      }
    });

    // Read inline target
    const itBlock = card.querySelector(`[data-inline-target="${prefix}_s${si}"]`);
    if (itBlock) {
      const itPf = `${prefix}_s${si}_it`;
      effect.inline_target = {
        target_type: val(`${itPf}_type`) || 'Unit',
        owner: val(`${itPf}_owner`) || 'Any',
        targeting: val(`${itPf}_targeting`) || 'Automatic',
      };
      const itc = val(`${itPf}_condition`);
      if (itc) effect.inline_target.condition = itc;
      const itr = num(`${itPf}_range`);
      if (itr) effect.inline_target.range = itr;
      const itcnt = num(`${itPf}_count`);
      if (itcnt && itcnt !== 1) effect.inline_target.count = itcnt;
      const itp = val(`${itPf}_prompt`);
      if (itp) effect.inline_target.prompt = itp;
    }

    // Read sub_effects
    const subList = card.querySelector(`[data-step-list="${prefix}_s${si}_sub"]`);
    if (subList) {
      const sub = readEffectsFromDOM(`${prefix}_s${si}_sub`);
      if (sub.length > 0) effect.sub_effects = sub;
    }

    // Read else_effects
    const elseList = card.querySelector(`[data-step-list="${prefix}_s${si}_else"]`);
    if (elseList) {
      const els = readEffectsFromDOM(`${prefix}_s${si}_else`);
      if (els.length > 0) effect.else_effects = els;
    }

    // Read choices
    let ci = 0;
    const choices = [];
    while (true) {
      const choiceList = card.querySelector(`[data-step-list="${prefix}_s${si}_ch${ci}"]`);
      const labelEl = card.querySelector(`[data-choice-label="${prefix}_s${si}_ch${ci}"]`);
      if (!choiceList && !labelEl) break;
      const choiceEffects = choiceList ? readEffectsFromDOM(`${prefix}_s${si}_ch${ci}`) : [];
      choices.push({ label: labelEl ? labelEl.value : '', effects: choiceEffects });
      ci++;
    }
    if (choices.length > 0) effect.choices = choices;

    effects.push(effect);
  });
  return effects;
}

// Legacy params not shown in UI but kept in data for runtime compatibility
const LEGACY_PARAMS = new Set(['DrawZone']);

function sanitizeEffectInPlace(effect) {
  if (!effect || typeof effect !== 'object') return;
  const step = effect.step || '';
  const allowed = new Set(STEP_PARAMETERS[step] || []);
  if (effect.parameters && typeof effect.parameters === 'object') {
    const next = {};
    Object.entries(effect.parameters).forEach(([k, v]) => {
      if (allowed.has(k) || LEGACY_PARAMS.has(k)) next[k] = v;
    });
    if (Object.keys(next).length > 0) effect.parameters = next;
    else delete effect.parameters;
  }
  if (Array.isArray(effect.sub_effects)) effect.sub_effects.forEach(sanitizeEffectInPlace);
  if (Array.isArray(effect.else_effects)) effect.else_effects.forEach(sanitizeEffectInPlace);
  if (Array.isArray(effect.choices)) {
    effect.choices.forEach(ch => {
      if (Array.isArray(ch.effects)) ch.effects.forEach(sanitizeEffectInPlace);
    });
  }
}

function sanitizeCardInPlace(card) {
  if (!card || typeof card !== 'object') return;
  if (!CARD_CLASSES.includes(card.card_class)) card.card_class = CARD_CLASSES[0];
  if (card.card_class2 && !CARD_CLASSES.includes(card.card_class2)) delete card.card_class2;

  if (card.card_type === 'character') {
    delete card.cost;
    delete card.rarity;
    delete card.health;
    delete card.attack;
    delete card.hp;
    delete card.move_speed;
    delete card.attack_range;
    delete card.spell_type;
    delete card.spell_range;
    delete card.school;
  }

  if (Array.isArray(card.abilities)) {
    card.abilities.forEach(ab => {
      if (!ab || typeof ab !== 'object') return;
      if (ab.trigger && typeof ab.trigger === 'object') {
        if (typeof ab.trigger.game_state_condition === 'string') {
          ab.trigger.game_state_condition = ab.trigger.game_state_condition.trim();
        }
      }
      if (Array.isArray(ab.effects)) {
        ab.effects.forEach(sanitizeEffectInPlace);
      }
    });
  }
}

function sanitizeAllCardsInPlace() {
  cards.forEach(sanitizeCardInPlace);
}

function val(name) {
  const el = document.querySelector(`[name="${name}"]`);
  return el ? el.value : '';
}
function num(name) {
  return parseInt(val(name)) || 0;
}
function markDirty() { dirty = true; }

function onTypeChange(sel) {
  if (sel.name === 'card_type') {
    readForm();
    renderEditor();
  }
}

function applyJson() {
  try {
    const raw = document.getElementById('json-raw').value;
    cards[selectedIdx] = JSON.parse(raw);
    sanitizeCardInPlace(cards[selectedIdx]);
    setStatus('JSON applied', 'ok');
    dirty = false;
    renderEditor();
  } catch (e) {
    setStatus('Invalid JSON: ' + e.message, 'err');
  }
}

// ===== ACTIONS =====
function addAbility() {
  readForm();
  const c = cards[selectedIdx];
  if (!c.abilities) c.abilities = [];
  c.abilities.push({
    ability_name: 'New Ability',
    description: '',
    trigger: { event: 'ON_PLAY' },
    targets: [],
    effects: []
  });
  renderEditor();
}
function removeAbility(ai) {
  readForm();
  cards[selectedIdx].abilities.splice(ai, 1);
  renderEditor();
}

function addCard() {
  const maxId = cards.reduce((m, c) => Math.max(m, c.card_id), 0);
  cards.push({
    card_id: maxId + 1,
    card_name: 'New Card',
    card_type: 'unit',
    card_class: 'Harcos',
    cost: 1,
    description: '',
    abilities: []
  });
  selectedIdx = cards.length - 1;
  renderList();
  renderEditor();
}

function deleteCard() {
  if (!confirm('Delete card ' + cards[selectedIdx].card_name + '?')) return;
  cards.splice(selectedIdx, 1);
  selectedIdx = -1;
  renderList();
  renderEditor();
}

async function saveAll() {
  if (dirty && selectedIdx >= 0) readForm();
  sanitizeAllCardsInPlace();
  setStatus('Saving...', '');
  const r = await fetch('/api/card-editor/save', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ cards })
  });
  const d = await r.json();
  if (d.ok) setStatus(`Saved ${d.count} cards to cards.json`, 'ok');
  else setStatus('Save error: ' + d.error, 'err');
}

async function generate() {
  if (dirty && selectedIdx >= 0) readForm();
  sanitizeAllCardsInPlace();
  setStatus('Generating...', '');
  await fetch('/api/card-editor/save', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ cards })
  });
  const r = await fetch('/api/card-editor/generate', { method: 'POST' });
  const d = await r.json();
  if (d.ok) setStatus('Generated! ' + (d.output || '').split('\n').pop(), 'ok');
  else setStatus('Generate error: ' + d.error, 'err');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// JSON mode toggle
document.getElementById('json-mode').addEventListener('change', () => {
  if (dirty && selectedIdx >= 0) readForm();
  renderEditor();
});

// Live side-help refresh for ability editor fields.
document.addEventListener('change', (ev) => {
  const target = ev.target;
  if (!target || typeof target.getAttribute !== 'function') return;
  const name = target.getAttribute('name') || '';
  if (!name.startsWith('ab_')) return;
  if (selectedIdx < 0) return;
  if (document.getElementById('json-mode').checked) return;
  readForm();
  renderEditor();
});

// Init
load();
</script>
</body>
